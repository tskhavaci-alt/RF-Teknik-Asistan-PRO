function bindWizardSpecific(c,n){if(n===0){document.querySelectorAll('[data-rail]').forEach(function(b){b.onclick=function(){c.rail=b.dataset.rail;render();};});document.getElementById('railInput').oninput=function(){c.rail=this.value.slice(0,65);var btn=document.getElementById('next');btn.disabled=!c.rail.trim();};}
if(n===1){document.querySelectorAll('[data-symptom]').forEach(function(b){b.onclick=function(){c.symptom=b.dataset.symptom;render();};});}
if(n===2){function add(name){name=String(name||'').trim().slice(0,65);if(!name)return;c.route.push({name:name});saveCase();render();}document.getElementById('addRoute').onclick=function(){add(document.getElementById('routeName').value);};document.getElementById('routeName').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();add(this.value);}};document.querySelectorAll('[data-quickroute]').forEach(function(b){b.onclick=function(){add(b.dataset.quickroute);};});document.getElementById('loadExample').onclick=function(){if(c.route.length&&!confirm('Mevcut hat yolunu örnekle değiştireyim mi?'))return;c.route=['Giriş konnektörü','Koruma / sigorta','Regülatör çıkışı','Seri ferrit L1','Yük kolu (C + IC)'].map(function(name){return {name:name};});c.target=3;c.kind='series';saveCase();render();};document.querySelectorAll('[data-delroute]').forEach(function(b){b.onclick=function(){var i=+b.dataset.delroute;c.route.splice(i,1);if(c.target>=c.route.length)c.target=c.route.length-1;saveCase();render();};});}
if(n===3){document.querySelectorAll('[data-target]').forEach(function(b){b.onclick=function(){if(c.target!==+b.dataset.target){c.target=+b.dataset.target;c.action='';c.result='';c.notes='';c.ohmSource='';c.ohmLoad='';c.ohmGood='';}render();};});document.querySelectorAll('[data-kind]').forEach(function(b){b.onclick=function(){c.kind=b.dataset.kind;c.action='';c.result='';render();};});}
if(n===4){document.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){var val=b.dataset.action;if(val==='isolated'&&c.kind!=='series'){alert('Bu seçim için eleman şemada doğrulanmış seri bağlantı olmalı.');return;}if(val==='lifted'&&c.kind!=='parallel'){alert('Bu seçim için elemanın paralel bağlı olması doğrulanmalı.');return;}c.action=val;c.result='';render();};});}
if(n===5){['ohmSource','ohmLoad','ohmGood'].forEach(function(k){var el=document.getElementById(k);if(el)el.oninput=function(){c[k]=this.value.replace(/[^0-9.,\s]/g,'').slice(0,30);};});document.querySelectorAll('[data-result]').forEach(function(b){b.onclick=function(){c.result=b.dataset.result;render();};});}
if(n===6){document.getElementById('prev').onclick=function(){step(5);};document.getElementById('saveResult').onclick=function(){c.notes=document.getElementById('notes').value.trim();recordHistory(c);saveCase();status('Ölçüm kaydedildi. Kayıtlarda görebilirsin.');};document.getElementById('nextCheck').onclick=function(){c.notes=document.getElementById('notes').value.trim();recordHistory(c);var suggested=suggestedNext(c);if(suggested>=0){c.target=suggested;c.kind='unknown';}c.action='';c.result='';c.notes='';c.ohmSource='';c.ohmLoad='';c.ohmGood='';saveCase();step(3);};document.getElementById('copyCase').onclick=function(){c.notes=document.getElementById('notes').value.trim();copyCase(c);};}

function advice(c){var part=c.route[c.target]?c.route[c.target].name:'Seçilen nokta';var before=c.route[c.target-1]?c.route[c.target-1].name:'Önceki kaynak bloğu';var after=c.route[c.target+1]?c.route[c.target+1].name:'Sonraki yük bloğu';var base={title:'Önce bağlantıyı doğrula',why:'Kart topolojisi kesinleşmeden arızalı parça söylenemez.',steps:['Gücün kapalı ve depolanan yükün boşalmış olduğunu doğrula.','Hattın şemadaki bağlantılarını ve sağlam kart referansını bul.','İlk normal ve ilk şüpheli ölçüm noktasını not et.'],caution:'Parça bağlantısını bilmeden rastgele sökme veya gerilim enjekte etme.'};

if(c.mode==='short'&&c.action==='isolated'&&c.kind==='series'){
 if(c.result==='load')return {title:'Yük tarafına ilerle',why:part+' seri ayırma noktasının sonrasında düşük direnç sürüyorsa, sonraki yük kolu önceliklidir.',steps:[after+' tarafında enerjisiz GND direncini karşılaştır.','Bu koldaki besleme kondansatörlerini, koruma diyotlarını ve entegre besleme pinlerini belirle.','Sonraki doğrulanmış seri ayırma noktasında aynı yöntemle bölgeyi daralt.'],caution:'Kaynak ve yük taraflarının gerçekten elektriksel ayrıldığından emin ol. Düşük ohm tek başına arıza kanıtı değildir.'};
 if(c.result==='source')return {title:'Kaynak tarafına geri git',why:part+' ayırma noktasının giriş tarafı şüpheli görünüyor.',steps:[before+' bağlantısına geri dön.','Koruma, regülatör çıkışı ve kaynak tarafındaki bypass elemanlarını kontrol et.','Enerjisiz direnç farkını sağlam kartla kıyasla; enerji varken yalnızca uygun gerilim ölçümü yap.'],caution:'Ölçümde paralel başka yollar olabileceğini unutma.'};
 if(c.result==='both')return {title:'İki tarafı ayrı doğrula',why:'İki tarafta düşük direnç olması iki arıza veya kartın normal paralel yolları nedeniyle olabilir.',steps:['Ayrımın tam olduğunu şema ve süreklilik testiyle doğrula.','Her iki tarafa ait enerjisiz GND ölçümünü sağlam karta göre ayrı değerlendir.','Varsa farklı seri kol veya ortak GND yollarını incele.'],caution:'İki tarafta düşük ohm görmek iki kısa devre var demek değildir.'};
 if(c.result==='gone')return {title:'Ayrımın etkisini doğrula',why:'Seri elemanın kaldırılması normal yükleri de ayırabilir; parçanın arızalı olduğu kanıtlanmaz.',steps:['Eleman dışarıdayken iki tarafı ayrı ölç.','Elemanın kendi DC direncini ve türünü kontrol et.','Ayrılan hattın tekrar bağlanması durumunda hangi kolda sorun oluştuğunu şemaya göre incele.'],caution:'Gerilim enjekte ederek veya rastgele yeniden enerji vererek doğrulama yapma.'};
 }
 if(c.mode==='short'&&c.action==='lifted'&&c.kind==='parallel'){
 if(c.result==='gone')return {title:'Parça ve pedler şüpheli',why:part+' ayrılınca belirti kaybolmuş; fakat bu, tek başına kesin komponent arızası değildir.',steps:['Sökülen parçayı kart dışında ölç; çatlak, kaçak ve doğru değer ihtimalini değerlendir.','Padler arasında lehim köprüsü ve komşu hat hasarı var mı incele.','Yeni parçanın yön/değer/gerilim sınırını doğrula; tekrar CC olursa besleme aşırılığı ve diğer yükleri araştır.'],caution:'Bileşen sökülünce kaybolan kısa, işlem sırasında oluşan bağlantı değişikliğinden de kaynaklanabilir.'};
 if(c.result==='returned')return {title:'Parçayı değiştirme döngüsünü durdur',why:part+' yeniden takılınca CC geri geliyor. Bu, parçanın bozuk olduğunu ispatlamaz; montaj, değer ve hattaki başka bir sorun da olabilir.',steps:['Yeni parçanın tam kodunu, polaritesini, değerini ve yerleşimini datasheet ile karşılaştır.','Enerjisizken parça pedleri, lehim köprüsü ve parçanın kart dışı ölçümünü kontrol et.','Beslemenin aşırı gerilim veya geri besleme üretip üretmediğini uygun ölçümle doğrula; aynı hattın paralel yüklerini ve şemadaki seri ayrımı incele.'],caution:'Arızanın nedenini bulmadan yeni parçayı tekrar tekrar takıp enerji verme.'};
 if(c.result==='persists')return {title:'Aynı hatta başka yük ara',why:part+' kaldırılınca belirti değişmedi.',steps:['Aynı hatta paralel bağlı C, TVS, diyot ve IC besleme pinlerini listele.','Şemadan doğrulanmış seri ayırma noktası bul.','Kısa kalan bölgeyi enerji kapalıyken kaynağa/yüke bölerek daralt.'],caution:'Sökülen parça kesin sağlam demek değildir; ölçüm referansına bak.'};
 }
 if(c.result==='normal')return {title:c.mode==='rf'?'Sonraki RF bloğuna git':'Bir sonraki hat noktasına ilerle',why:part+' bu ölçümde referansla uyumlu.',steps:[after+' noktasını kontrol et.','Son sağlam ve ilk farklı sonuç veren noktaları yan yana not et.','İşlevi etkileyen enable, clock ve besleme sinyallerini gerektiğinde kontrol et.'],caution:'Tek normal ölçüm, o bloğun tüm çalışma koşullarında sağlam olduğunu kanıtlamaz.'};
 if(c.result==='low')return {title:'Bu bloğun giriş koşullarını ayır',why:part+' çevresinde beklenenden farklı ölçüm var.',steps:[before+' çıkışı ile '+part+' girişini karşılaştır.','Paralel yükleri ve şemada doğrulanan ayırma noktalarını belirle.','Şüpheli bölümün besleme, GND, enable ve ölçüm probu bağlantılarını kontrol et.'],caution:'RF ölçümlerinde kablo, prob yüklemesi ve cihaz ayarları sahte hata gösterebilir.'};
 return base;
}
function recordHistory(c){if(!Array.isArray(c.history))c.history=[];var r={at:new Date().toLocaleString('tr-TR'),target:c.route[c.target]?c.route[c.target].name:'',kind:c.kind,action:c.action,result:c.result,notes:c.notes||'',ohmSource:c.ohmSource||'',ohmLoad:c.ohmLoad||'',ohmGood:c.ohmGood||'',advice:advice(c).title};var last=c.history[c.history.length-1];if(last&&last.target===r.target&&last.action===r.action&&last.result===r.result&&last.notes===r.notes&&last.ohmSource===r.ohmSource&&last.ohmLoad===r.ohmLoad&&last.ohmGood===r.ohmGood)return;c.history.push(r);c.history=c.history.slice(-90);}
function suggestedNext(c){if(c.target<0||!Array.isArray(c.route))return -1;var delta=0;if(c.kind==='series'&&c.action==='isolated'&&c.mode==='short'){if(c.result==='load')delta=1;else if(c.result==='source')delta=-1;}else if(c.result==='normal'&&c.mode!=='short')delta=1;if(!delta)return -1;var i=c.target+delta;return i>=0&&i<c.route.length?i:-1;}
function compareInfo(c){var data=[['Kaynak',c.ohmSource],['Yük',c.ohmLoad],['Sağlam',c.ohmGood]].filter(function(x){return x[1]&&String(x[1]).trim();});return data.length?'<div class="measureview">'+data.map(function(x){return '<span>'+x[0]+': '+safe(x[1])+' Ω</span>';}).join('')+'</div>':'';}

function clip(text){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(text);}var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');}finally{a.remove();}return Promise.resolve();}
function copyCase(c){var part=c.route[c.target]?c.route[c.target].name:'Seçilmedi';var ask='Elektronik kartta genel arıza arama için sonraki güvenli ölçümü öner.\nHat: '+c.rail+'\nArıza: '+LABEL[c.mode]+'\nBelirti: '+c.symptom+'\nYol: '+c.route.map(function(x){return x.name;}).join(' → ')+'\nSeçilen malzeme: '+part+' ('+c.kind+')\nİşlem: '+c.action+'\nSonuç: '+c.result+'\nKaynak GND direnci (Ω): '+(c.ohmSource||'girilmedi')+'\nYük GND direnci (Ω): '+(c.ohmLoad||'girilmedi')+'\nSağlam kart (Ω): '+(c.ohmGood||'girilmedi')+'\nÖlçüm: '+(c.notes||'girilmedi')+'\nParçanın arızalı olduğunu yalnızca bu bilgilerden kesin söyleme.';Promise.resolve(clip(ask)).then(function(){status('Soru metni kopyalandı. Sohbete yapıştırabilirsin.');}).catch(function(){status('Kopyalanamadı; izinleri kontrol et.');});}
function home(){document.getElementById('topTitle').textContent='Elektronik Arıza Asistanı';document.getElementById('topLine').textContent='Bir ölçüm, bir karar, sıradaki parça.';var recent=app.cases[0];var html='<section class="screen"><span class="eyebrow">HOŞ GELDİN</span><h1 class="hero">Bugün hangi arızayı<br>araştırıyoruz?</h1><p class="sub">Arızayı seç. İlk ölçümden bir sonraki parçaya kadar uygulama yönlendirsin.</p><div class="tilegrid"><button class="tile accent" data-start="short"><span class="ico">'+icon('i-bolt')+'</span><span><strong>Kısa devre ara</strong><small>5 V, CC, düşük ohm</small></span></button><button class="tile" data-start="power"><span class="ico">'+icon('i-activity')+'</span><span><strong>Besleme arızası</strong><small>Kaynak → yük kontrolü</small></span></button><button class="tile" data-start="rf"><span class="ico">'+icon('i-layers')+'</span><span><strong>RF sinyal arızası</strong><small>İlk hatalı bloğu bul</small></span></button><button class="tile" id="openLogs"><span class="ico">'+icon('i-clipboard')+'</span><span><strong>Ölçüm kayıtları</strong><small>Önceki incelemelerin</small></span></button></div>'+(recent?'<button class="resume" data-resume="'+safe(recent.id)+'">'+icon('i-clipboard')+'<span><strong>Son vakaya devam et</strong><small>'+safe(recent.rail)+' • '+safe(LABEL[recent.mode])+' • '+safe(recent.date)+'</small></span>'+icon('i-arrow')+'</button>':'')+'<div class="tip">'+icon('i-help')+'<span>İlk kez mi kullanıyorsun? <button id="homeHelp" class="textbtn" style="padding:0">Nasıl çalıştığını öğren</button></span></div><p class="foot">Genel elektronik yöntemleri • Yerel kayıt • Özel şirket bilgisi içermez</p></section>';main(html);document.querySelectorAll('[data-start]').forEach(function(b){b.onclick=function(){start(b.dataset.start);};});document.getElementById('openLogs').onclick=function(){go('logs');};document.getElementById('homeHelp').onclick=function(){go('help');};document.querySelectorAll('[data-resume]').forEach(function(b){b.onclick=function(){resume(b.dataset.resume);};});}
function logs(){document.getElementById('topTitle').textContent='Ölçüm Kayıtları';document.getElementById('topLine').textContent='Vaka geçmişin bu cihazda saklanır.';var html='<section class="screen"><span class="eyebrow">VAKA DOSYALARI</span><h1 class="hero">Nerede kalmıştın?</h1><p class="sub">Ölçüm yaptıkça kaydet; bir sonraki sefer aynı vakaya dön.</p><div class="actions"><button id="export" class="cta secondary only">JSON yedek indir</button><button id="newCase" class="cta only">+ Yeni vaka</button></div><details class="measurement"><summary>JSON yedeğini geri yükle</summary><p class="tiny">Yalnızca bu uygulamadan aldığın V5/V5.1 JSON yedeğini seç. Aynı kimlikli kayıtlar korunur.</p><div class="importline"><input type="file" accept=".json,application/json" id="importFile" aria-label="Yedek dosyasını seç"></div></details><p class="status" id="status"></p><div class="separator"></div><div class="log">'+(app.cases.length?app.cases.map(function(c){var last=c.history&&c.history.length?c.history[c.history.length-1]:null;return '<div class="case-item"><button data-resume="'+safe(c.id)+'"><strong>'+safe(c.rail)+' • '+safe(LABEL[c.mode])+'</strong><small>'+safe(c.date)+' • '+(c.history?c.history.length:0)+' ölçüm</small><p>'+safe(last?last.target+' — '+last.advice:'İncelemeye devam et')+'</p></button>'+(c.history&&c.history.length?'<details><summary>Ölçüm geçmişini karşılaştır ('+c.history.length+')</summary>'+c.history.slice().reverse().map(function(h){return '<div class="history-item"><strong>'+safe(h.target||'Ölçüm')+' · '+safe(h.advice||h.result)+'</strong><small>'+safe(h.at)+'</small>'+compareInfo(h)+(h.notes?'<small>'+safe(h.notes)+'</small>':'')+'</div>';}).join('')+'</details>':'')+'</div>';}).join(''):'<p class="empty">Henüz kayıt yok. Kısa devre butonuyla ilk incelemeyi başlat.</p>')+'</div><div class="floatinghelp">V4.4 sürümüne ait eski kayıtlar ayrı depolama anahtarında korunur. Yeni sürüm bunları otomatik değiştirmez. Gizli kart verilerini kaydetme.</div></section>';main(html);document.getElementById('newCase').onclick=function(){start('short');};document.querySelectorAll('[data-resume]').forEach(function(b){b.onclick=function(){resume(b.dataset.resume);};});document.getElementById('export').onclick=function(){try{var s=JSON.stringify({version:5,cases:app.cases},null,2);var blob=new Blob([s],{type:'application/json'}),url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='Kart-Ariza-V5-Yedek.json';document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1500);status('JSON yedeği hazırlandı.');}catch(e){status('İndirme desteklenmiyor olabilir.');}};document.getElementById('importFile').onchange=function(){var file=this.files&&this.files[0];if(!file)return;if(file.size>1024*1024){status('Yedek 1 MB üzerinde; dosyayı kontrol et.');return;}file.text().then(function(raw){var data=JSON.parse(raw);if((data.version!==5&&data.version!=='5.1')||!Array.isArray(data.cases))throw Error('Biçim');var incoming=data.cases.map(function(c){if(!c||!c.id||!['short','power','rf'].includes(c.mode)||typeof c.rail!=='string'||!Array.isArray(c.route)||!Array.isArray(c.history))throw Error('Vaka');return {id:String(c.id).slice(0,90),date:String(c.date||'').slice(0,80),mode:c.mode,rail:c.rail.slice(0,65),symptom:String(c.symptom||'').slice(0,55),route:c.route.slice(0,75).map(function(x){return {name:String(x.name||'').slice(0,65)};}),target:Number.isInteger(c.target)?c.target:-1,kind:['series','parallel','unknown'].includes(c.kind)?c.kind:'unknown',action:String(c.action||'').slice(0,40),result:String(c.result||'').slice(0,40),notes:String(c.notes||'').slice(0,500),ohmSource:String(c.ohmSource||'').slice(0,30),ohmLoad:String(c.ohmLoad||'').slice(0,30),ohmGood:String(c.ohmGood||'').slice(0,30),step:Number.isInteger(c.step)?Math.max(0,Math.min(6,c.step)):0,history:c.history.slice(-90).map(function(h){return {at:String(h.at||'').slice(0,80),target:String(h.target||'').slice(0,70),kind:String(h.kind||'').slice(0,35),action:String(h.action||'').slice(0,35),result:String(h.result||'').slice(0,35),notes:String(h.notes||'').slice(0,500),advice:String(h.advice||'').slice(0,110),ohmSource:String(h.ohmSource||'').slice(0,30),ohmLoad:String(h.ohmLoad||'').slice(0,30),ohmGood:String(h.ohmGood||'').slice(0,30)};})};});if(!confirm(incoming.length+' vaka geri yüklensin mi? Mevcut farklı vakalar korunacak.'))return;var ids=new Set(app.cases.map(function(x){return x.id;}));incoming.forEach(function(c){if(!ids.has(c.id)){app.cases.push(c);ids.add(c.id);}});app.cases=app.cases.slice(0,120);if(persist())logs();}).catch(function(){status('Yedek okunamadı. Yalnızca V5/V5.1 JSON dosyası kullan.');});};}
function pin(){document.getElementById('topTitle').textContent='Entegre Pin Rehberi';document.getElementById('topLine').textContent='Pin ne işe yarar, sonra nereye bakılır?';var choices=Object.keys(PIN);var info=PIN[app.pinName];main('<section class="screen"><span class="eyebrow">PIN AÇIKLAMALARI</span><h1 class="hero">Entegre üzerinde ne yazıyor?</h1><p class="sub">Modelini ve gördüğün pin kısaltmasını yaz. Açıklamalar geneldir; gerçek pin işlevi üretici datasheet’ine bağlıdır.</p><label class="field">Entegre kodu (isteğe bağlı)<input id="model" maxlength="90" placeholder="Örn. bir regülatör model kodu" value="'+safe(app.pinModel)+'"></label><label class="field">Pin seç<select id="pinSelect">'+choices.map(function(x){return '<option value="'+x+'" '+(app.pinName===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select></label><div class="card pinresult"><span class="eyebrow">'+safe(app.pinName)+' NEDİR?</span><h3>'+safe(info[0])+'</h3><p>'+safe(info[1])+'</p><div class="separator"></div><b style="font-size:13px">Sıradaki kontrol</b><p>'+safe(info[2])+'</p></div><button class="cta" id="datasheet">Üretici datasheet ara '+icon('i-arrow')+'</button><p class="boxnote warn">Aynı kısaltma farklı entegrelerde başka görev taşıyabilir. Gerçek ayak numarasını, pin fonksiyonunu ve izin verilen gerilimi datasheet belgesinden doğrula.</p></section>');document.getElementById('model').oninput=function(){app.pinModel=this.value;};document.getElementById('pinSelect').onchange=function(){app.pinName=this.value;app.pinModel=document.getElementById('model').value;pin();};document.getElementById('datasheet').onclick=function(){var m=document.getElementById('model').value.trim();if(!m){alert('Önce entegre modelini yaz.');return;}var url='https://www.google.com/search?q='+encodeURIComponent(m+' official datasheet pin functions');window.open(url,'_blank','noopener,noreferrer');};}
function help(){document.getElementById('topTitle').textContent='Uygulama Rehberi';document.getElementById('topLine').textContent='Bir dakikada kullanım';main('<section class="screen"><span class="eyebrow">NASIL ÇALIŞIR?</span><h1 class="hero">Kartı birlikte inceleyelim.</h1><div class="card"><ol class="numberlist"><li><b>1</b><span><strong>Arızayı seç.</strong> Kısa devre, besleme veya RF.</span></li><li><b>2</b><span><strong>Hattı yaz.</strong> Örneğin 5 V. CC görüyorsan kaydet; CC her zaman kısa devre değildir.</span></li><li><b>3</b><span><strong>Gerçek yolu gir.</strong> Kaynaktan sonra hangi eleman geliyor? Sırasıyla ekle. Örnek yol sadece temsildir.</span></li><li><b>4</b><span><strong>Bağlantıyı doğrula.</strong> Seri ferrit hattı bölebilir; paralel kondansatör iki nokta arasındadır.</span></li><li><b>5</b><span><strong>Gerçek işlem ve sonucu seç.</strong> Enerjisiz ölçüm, güvenli ayırma, kısa nerede kaldı?</span></li><li><b>6</b><span><strong>Öneriyi uygula ve kaydet.</strong> Uygulama sonraki kontrol bölgesini söyler, kesin bozuk parça ilan etmez.</span></li></ol></div><div class="boxnote warn">⚠️ Güç kapalı ve kapasitörler boşalmış olmadan direnç/süreklilik ölçme. Bağlantısını bilmediğin elemanı kaldırma, bilinmeyen hatta rastgele voltaj/akım enjekte etme. Kuruma ait gizli şema ve kart kodlarını bu uygulamaya girme.</div><button class="cta" style="width:100%" id="try">Kısa devre ile başla '+icon('i-arrow')+'</button></section>');document.getElementById('try').onclick=function(){start('short');};}
function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('selected',app.tab===b.dataset.tab);});if(app.tab==='home')home();else if(app.tab==='wizard')wizard();else if(app.tab==='pin')pin();else if(app.tab==='logs')logs();else if(app.tab==='help')help();}
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){if(app.tab==='wizard')saveCase();go(b.dataset.tab);};});document.getElementById('helpBtn').onclick=function(){go('help');};document.addEventListener('click',function(e){var b=e.target.closest('[data-gloss]');if(!b)return;if(b.dataset.gloss==='CC')alert('CC (Constant Current): Güç kaynağı akım sınırlama kipine geçmiştir. Kısa devre, aşırı yük veya ayar kaynaklı olabilir.');else alert('Seri: Akım yolu üzerindeki elemandır, ayrılması iki bölgeyi ayırabilir. Paralel: Aynı iki düğüme bağlı elemandır. Bypass kondansatörü örnektir. Şemadan doğrula.');});render();
})();
</script>
