name: RF Teknik Asistan PRO Imzali APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK hazirla
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Imza anahtarini hazirla
        env:
          RF_KEYSTORE_BASE64: ${{ secrets.RF_KEYSTORE_BASE64 }}
        run: | test -n "$RF_KEYSTORE_BASE64" printf '%s' "$RF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rf-release.jks"       - name: Imzali release APK olustur
        env:
          RF_STORE_PASSWORD: ${{ secrets.RF_STORE_PASSWORD }}
          RF_KEY_PASSWORD: ${{ secrets.RF_KEY_PASSWORD }}
        run: | test -n "$RF_STORE_PASSWORD" test -n "$RF_KEY_PASSWORD" gradle assembleRelease --no-daemon -PrfKeystorePath="$RUNNER_TEMP/rf-release.jks" -PrfStorePassword="$RF_STORE_PASSWORD" -PrfKeyPassword="$RF_KEY_PASSWORD"       - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: RF-Teknik-Asistan-PRO-Imzali-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
