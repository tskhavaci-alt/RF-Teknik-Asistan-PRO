plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rfteknikasistan.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rfteknikasistan.pro'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }

    signingConfigs {
        release {
            if (project.hasProperty('rfKeystorePath')) {
                storeFile file(project.property('rfKeystorePath'))
                storePassword project.property('rfStorePassword').toString()
                keyAlias 'rf-teknik-asistan'
                keyPassword project.property('rfKeyPassword').toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
